<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>포트폴리오 공유 이미지 원본</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  main {
    width: 1200px; height: 630px; padding: 64px 80px 76px; background: #fff; color: #17191c;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; gap: 15px; padding-bottom: 30px; border-bottom: 2px solid #d7dbdf; }
  header img { width: 44px; height: 44px; }
  strong { font-size: 32px; letter-spacing: -.05em; }
  small { margin-left: auto; font: 600 20px ui-monospace, monospace; letter-spacing: .08em; color: #535b66; }
  section { margin-block: auto; }
  p { display: flex; align-items: center; gap: 16px; margin: 0 0 24px; color: #2454c6; font-size: 26px; font-weight: 650; }
  p::before { content: ""; width: 34px; height: 3px; background: currentColor; }
  h1 { margin: 0; font-size: 72px; font-weight: 740; line-height: 1.22; letter-spacing: -.045em;
       white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
</style>
<main>
  <header><img src="../src/app/favicon.ico" alt=""><strong>오하민</strong><small>PORTFOLIO</small></header>
  <section><p></p><h1></h1></section>
</main>
</html>
